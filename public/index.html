<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>kimse · anonim sohbet</title>
  <meta name="description" content="Anonim sohbet. Sana bir renk verilir; adın yok, iz yok.">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="kimse">
  <meta property="og:description" content="Anonim sohbet. Sana bir renk verilir; adın yok, iz yok.">
  <meta property="og:type" content="website">
  <!-- Alan adı değişirse aşağıdaki iki adresi güncelle: X'te paylaşılan linkte çıkan görselli kart buradan gelir. -->
  <meta property="og:url" content="https://kimse.vercel.app/">
  <meta property="og:image" content="https://kimse.vercel.app/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232e3a52'/%3E%3Crect x='5' y='7' width='14' height='3' rx='1.5' fill='%23e07f37'/%3E%3Crect x='5' y='14' width='9' height='3' rx='1.5' fill='%233f82c0'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/open-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/open-sans-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
<main id="app" data-view="home">
  <div class="card">

    <!-- Renk şeridi: ana sayfada bütün renkler, sohbette o an oradaki kişilerin renkleri -->
    <div id="strip" class="strip" aria-hidden="true"></div>

    <header class="top">
      <span class="brand">kimse</span>
      <span id="online" class="online" aria-live="polite"></span>
      <button id="btn-theme" class="icon-btn" type="button" aria-label="Koyu ve açık görünüm arasında geç">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </header>

    <!-- Ana sayfa -->
    <section id="v-home" class="view mid">
      <div class="col">
        <h1 id="home-title" class="title">Anonim sohbet</h1>
        <p class="sub">Sana bir renk verilir. Adın yok, iz yok.</p>
        <div id="tags-box" class="tags-box">
          <span id="tags-label" class="tags-label">Konu (isteğe bağlı)</span>
          <div id="tags" class="tags" role="group" aria-labelledby="tags-label">
            <button type="button" data-tag="oyun" aria-pressed="false">Oyun</button>
            <button type="button" data-tag="muzik" aria-pressed="false">Müzik</button>
            <button type="button" data-tag="dert" aria-pressed="false">Dertleşme</button>
            <button type="button" data-tag="film" aria-pressed="false">Dizi film</button>
            <button type="button" data-tag="spor" aria-pressed="false">Spor</button>
          </div>
        </div>
        <div id="moods-box" class="tags-box">
          <span id="moods-label" class="tags-label">Ruh hali (isteğe bağlı)</span>
          <div id="moods" class="tags" role="group" aria-labelledby="moods-label">
            <button type="button" data-mood="mutlu" aria-pressed="false">Mutlu</button>
            <button type="button" data-mood="uzgun" aria-pressed="false">Üzgün</button>
            <button type="button" data-mood="moralsiz" aria-pressed="false">Moralsiz</button>
            <button type="button" data-mood="sikilmis" aria-pressed="false">Sıkılmış</button>
            <button type="button" data-mood="yalniz" aria-pressed="false">Yalnız</button>
            <button type="button" data-mood="heyecanli" aria-pressed="false">Heyecanlı</button>
          </div>
        </div>
        <label class="check">
          <input id="age" type="checkbox">
          <span>18 yaşından büyüğüm</span>
        </label>
        <button id="btn-find" class="btn primary" type="button" disabled>Birini bul</button>
        <button id="btn-door" class="btn ghost" type="button" disabled>Oda oluştur</button>
        <button id="btn-random" class="btn text" type="button" hidden>Rastgele sohbete geç</button>
        <p id="home-err" class="err" role="alert" hidden></p>
      </div>
    </section>

    <!-- Arama -->
    <section id="v-search" class="view mid" hidden>
      <div class="col">
        <h2 id="search-title" class="title">Aranıyor</h2>
        <div class="spinner" aria-hidden="true"></div>
        <p id="search-sub" class="sub num" aria-live="polite"></p>
        <button id="btn-lonely-door" class="btn ghost" type="button" hidden>Oda oluştur</button>
        <button id="btn-cancel" class="btn ghost" type="button">Vazgeç</button>
      </div>
    </section>

    <!-- Sohbet: 1'e 1 ve oda aynı ekranı kullanır -->
    <section id="v-chat" class="view chat" hidden>
      <header class="chat-head">
        <div class="who">
          <strong><i id="peer-dot" class="sq" aria-hidden="true"></i><span id="peer-name"></span><span id="peer-mood" class="mood-chip" hidden></span></strong>
          <span id="peer-status" class="status" aria-live="polite"></span>
        </div>
        <button id="btn-nick" class="me-tag" type="button" aria-label="Adın, ruh halin, ne dinlediğin">Sen <i id="me-dot" class="sq" aria-hidden="true"></i><b id="me-name"></b></button>
        <button id="btn-end" class="btn sm ghost" type="button">Bitir</button>
      </header>

      <!-- Oda linki: yalnızca odada görünür -->
      <div id="room-bar" class="room-bar" hidden>
        <span>Oda linki</span>
        <button id="btn-copy" class="btn xs ghost" type="button">Kopyala</button>
        <a id="btn-share-door" class="btn xs ghost" target="_blank" rel="noopener noreferrer">X'te paylaş</a>
      </div>

      <ul id="msgs" class="msgs" aria-live="polite" aria-label="Mesajlar"></ul>

      <!-- Sıralı oyun tahtası: XOX ve Dört bağla -->
      <div id="game" class="game" hidden>
        <div class="game-head">
          <b id="game-title"></b>
          <span id="game-status" class="game-status" aria-live="polite"></span>
          <button id="game-x" class="btn xs text" type="button">Bırak</button>
        </div>
        <div id="game-grid" class="grid" role="group" aria-label="Oyun tahtası"></div>
        <div id="game-acts" class="game-acts" hidden>
          <button id="game-again" class="btn xs primary" type="button">Rövanş</button>
          <button id="game-close" class="btn xs ghost" type="button">Kapat</button>
        </div>
      </div>

      <!-- Yanıtlanan mesaj -->
      <div id="reply-bar" class="reply-bar" hidden>
        <div id="reply-quote" class="quote"><b id="reply-who"></b><span id="reply-text"></span></div>
        <button id="btn-reply-x" class="btn xs text" type="button">Vazgeç</button>
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <div class="field">
          <button id="btn-vanish" class="vanish" type="button" aria-pressed="false" aria-label="Kaybolan mesaj: 10 saniye sonra iki taraftan da silinir">10 sn</button>
          <input id="input" type="text" maxlength="500" placeholder="Mesajını yaz" enterkeyhint="send" autocomplete="off" aria-label="Mesaj">
          <button class="send" type="submit">Gönder</button>
        </div>
      </form>

      <nav class="chat-foot" aria-label="Sohbet işlemleri">
        <button id="btn-games" class="btn xs ghost" type="button">Oyunlar</button>
        <button id="btn-nudge" class="btn xs ghost" type="button">Titreşim</button>
        <button id="btn-report" class="btn xs text" type="button">Bildir</button>
      </nav>
    </section>

    <!-- Sohbet sonu -->
    <section id="v-end" class="view mid" hidden>
      <div class="col">
        <h2 id="end-title" class="title"></h2>
        <p id="end-stats" class="sub num"></p>
        <p id="end-auto" class="sub num" aria-live="polite" hidden></p>
        <button id="btn-again" class="btn primary" type="button">Yeni sohbet</button>
        <a id="btn-share" class="btn ghost" target="_blank" rel="noopener noreferrer">X'te paylaş</a>
        <label id="auto-wrap" class="check">
          <input id="auto" type="checkbox">
          <span>Karşı taraf çıkınca otomatik yeni sohbet</span>
        </label>
        <button id="btn-home" class="btn text" type="button">Ana sayfa</button>
      </div>
    </section>

    <!-- Bilgi / hata / engel -->
    <section id="v-note" class="view mid" hidden>
      <div class="col">
        <h2 id="note-title" class="title"></h2>
        <p id="note-text" class="sub"></p>
        <button id="btn-note-home" class="btn ghost" type="button">Ana sayfa</button>
      </div>
    </section>

  </div>

  <!-- Profil: ad, ne dinliyorum, ruh hali, güvenlik kodu -->
  <div id="profile" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="profile-title">
    <form id="profile-form" class="sheet-card" autocomplete="off">
      <h3 id="profile-title">Sen</h3>
      <label class="field-label" for="p-nick">Adın (yalnızca bu sohbette)</label>
      <input id="p-nick" class="sheet-input" type="text" maxlength="16">
      <label class="field-label" for="p-listen">Ne dinliyorsun?</label>
      <input id="p-listen" class="sheet-input" type="text" maxlength="60" placeholder="Şarkı ya da sanatçı">
      <span id="p-moods-label" class="field-label">Ruh hali</span>
      <div id="p-moods" class="tags left" role="group" aria-labelledby="p-moods-label"></div>
      <p id="p-code" class="p-code"></p>
      <div class="sheet-actions">
        <button id="p-save" class="btn primary" type="submit">Kaydet</button>
        <button id="p-cancel" class="btn ghost" type="button">Vazgeç</button>
      </div>
    </form>
  </div>

  <!-- Onay penceresi -->
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-card">
      <h3 id="sheet-title"></h3>
      <p id="sheet-text"></p>
      <input id="sheet-input" class="sheet-input" type="text" autocomplete="off" aria-labelledby="sheet-title" hidden>
      <div id="sheet-actions" class="sheet-actions"></div>
    </div>
  </div>

  <!-- Mesaj menüsü: basılı tutunca açılır. Tepki düğmeleri açılırken eklenir. -->
  <div id="menu" class="menu" hidden>
    <div id="menu-panel" class="menu-panel" role="menu" aria-label="Mesaj">
      <div id="menu-reacts" class="menu-reacts"></div>
      <button id="menu-reply" class="menu-item" type="button" role="menuitem">Yanıtla</button>
      <button id="menu-copy" class="menu-item" type="button" role="menuitem">Kopyala</button>
      <button id="menu-unsend" class="menu-item danger" type="button" role="menuitem">Geri al</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</main>
<noscript><p class="noscript">Bu site JavaScript ile çalışır.</p></noscript>
</body>
</html>
