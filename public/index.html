<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>kimse · anonim sohbet</title>
  <meta name="description" content="Bir yabancıyla anonim sohbet. Kayıt yok, iz yok.">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f3f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0e0c" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="kimse">
  <meta property="og:description" content="Bir yabancıyla anonim sohbet. Kayıt yok, iz yok.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <!-- Alan adın belli olunca: yukarıdaki satırı sil, aşağıdaki iki satırı aç ve ALAN-ADIN yerine kendi adresini yaz.
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:image" content="https://ALAN-ADIN/og.png">
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23141512'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%234ade80'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/open-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/open-sans-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<main id="app">

  <!-- Ana sayfa -->
  <section id="v-home" class="view home">
    <div class="home-top">
      <h1 class="wordmark" aria-label="kimse"><span aria-hidden="true">k<span class="i">ı</span>mse</span></h1>
      <p class="tagline">Anonim sohbet. Kayıt yok, iz yok.</p>
    </div>

    <div class="home-main">
      <p id="door-note" class="invited" hidden>Davet edildin</p>
      <p id="online" class="online" aria-live="polite"></p>
      <label class="age">
        <input id="age" type="checkbox">
        <span>18 yaşından büyüğüm</span>
      </label>
      <button id="btn-find" class="btn primary" type="button" disabled>Birini bul</button>
      <button id="btn-door" class="btn ghost" type="button" disabled>Davet linki oluştur</button>
      <button id="btn-random" class="btn link" type="button" hidden>Rastgele sohbete geç</button>
      <p id="home-err" class="err" role="alert" hidden></p>
    </div>

    <p class="foot">Uçtan uca şifreli · Çerez yok</p>
  </section>

  <!-- Arama / davet bekleme -->
  <section id="v-search" class="view center" hidden>
    <div class="radar" aria-hidden="true"><i></i></div>
    <h2 id="search-title">Birini arıyorum…</h2>
    <p id="search-sub" class="muted num" aria-live="polite"></p>

    <div id="door-box" class="doorbox" hidden>
      <input id="door-link" type="text" readonly aria-label="Davet linki">
      <div class="row">
        <button id="btn-copy" class="btn small" type="button">Kopyala</button>
        <a id="btn-share-door" class="btn small ghost" target="_blank" rel="noopener noreferrer">X'te paylaş</a>
      </div>
    </div>

    <button id="btn-lonely-door" class="btn small ghost" type="button" hidden>Davet linki oluştur</button>
    <button id="btn-cancel" class="btn link" type="button">Vazgeç</button>
  </section>

  <!-- Sohbet -->
  <section id="v-chat" class="view chat" hidden>
    <header class="chat-head">
      <div class="who">
        <strong id="peer-name"></strong>
        <span id="peer-status" class="status" aria-live="polite"></span>
      </div>
      <button id="btn-code" class="icon-btn" type="button" aria-label="Güvenlik kodu">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.2 11V8a3.8 3.8 0 0 1 7.6 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-report" class="icon-btn" type="button" aria-label="Bildir">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M6 21V4.5M6 5h11.5l-2.2 3.8 2.2 3.8H6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-end" class="btn tiny" type="button">Bitir</button>
    </header>

    <div class="ice">
      <div class="ice-text">
        <span class="ice-label">Buz kırıcı</span>
        <p id="ice-q"></p>
      </div>
      <button id="btn-ice" class="icon-btn" type="button" aria-label="Başka soru">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.3-5.4M19.5 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <ul id="msgs" class="msgs" aria-live="polite" aria-label="Mesajlar"></ul>

    <!-- Taş kağıt makas -->
    <div id="rps" class="rps" hidden>
      <p id="rps-status" class="rps-status" aria-live="polite"></p>
      <div id="rps-picks" class="rps-picks">
        <button type="button" data-move="t" aria-label="Taş">✊</button>
        <button type="button" data-move="k" aria-label="Kağıt">✋</button>
        <button type="button" data-move="m" aria-label="Makas">✌️</button>
        <button type="button" data-move="?" aria-label="Rastgele seç">🎲</button>
      </div>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <button id="btn-game" class="game-btn" type="button" aria-label="Taş kağıt makas" aria-expanded="false" aria-controls="rps">✊</button>
      <input id="input" type="text" maxlength="500" placeholder="Bir şey yaz…" enterkeyhint="send" autocomplete="off" aria-label="Mesaj">
      <button class="send" type="submit" aria-label="Gönder">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </section>

  <!-- Sohbet sonu -->
  <section id="v-end" class="view center" hidden>
    <h2 id="end-title"></h2>
    <p id="end-stats" class="stats num"></p>
    <p class="muted small">Mesajlar silindi.</p>
    <div class="stack">
      <button id="btn-again" class="btn primary" type="button">Yeni sohbet</button>
      <a id="btn-share" class="btn ghost" target="_blank" rel="noopener noreferrer">X'te paylaş</a>
      <button id="btn-home" class="btn link" type="button">Ana sayfa</button>
    </div>
  </section>

  <!-- Bilgi / hata / engel -->
  <section id="v-note" class="view center" hidden>
    <h2 id="note-title"></h2>
    <p id="note-text" class="muted"></p>
    <div class="stack">
      <button id="btn-note-home" class="btn ghost" type="button">Ana sayfa</button>
    </div>
  </section>

  <!-- Onay penceresi -->
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-card">
      <h3 id="sheet-title"></h3>
      <p id="sheet-text"></p>
      <div id="sheet-actions" class="stack"></div>
    </div>
  </div>

</main>
<noscript><p class="noscript">Bu site JavaScript ile çalışır.</p></noscript>
</body>
</html>
